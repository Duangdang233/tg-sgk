services:
  api:
    build: .
    container_name: tg-sgk-api
    restart: unless-stopped
    env_file: .env
    volumes:
      - tg_data:/data
    expose:
      - "8000"
    networks:
      - tg_sgk
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  login:
    build: .
    profiles: ["tools"]
    env_file: .env
    volumes:
      - tg_data:/data
    networks:
      - tg_sgk
    stdin_open: true
    tty: true
    command: ["python", "-m", "app.login"]

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      TG_SGK_DOMAIN: ${TG_SGK_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    networks:
      - tg_sgk
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  tg_sgk:
    name: tg-sgk-net

volumes:
  tg_data:
  caddy_data:
  caddy_config:
